
name: Trigger ServiceNow Automation Demo

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  trigger-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger the automation workflow using REST API
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          RESPONSE=$(curl -sS -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/servicenow-db-automation.yml/dispatches" \
            -d '{"ref":"main","inputs":{"request_id":"REQ1002","action":"validate_database"}}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          echo "GitHub API HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "204" ]; then
            echo "Failed to trigger the automation workflow"
            exit 1
          fi

          echo "Automation workflow triggered successfully"
